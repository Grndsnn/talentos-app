<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 140" width="120" height="140">
  <defs>
    <filter id="shadow-o">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0ea5e9" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Antenna -->
  <line x1="60" y1="8" x2="60" y2="22" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  <circle cx="60" cy="6" r="5" fill="#38bdf8"/>
  <circle cx="60" cy="6" r="2.5" fill="#bae6fd"/>

  <!-- Head (rounded rect) -->
  <rect x="28" y="20" width="64" height="52" rx="18" fill="#0ea5e9" filter="url(#shadow-o)"/>
  <!-- Head shine -->
  <ellipse cx="47" cy="30" rx="10" ry="5" fill="white" opacity="0.15" transform="rotate(-15,47,30)"/>

  <!-- Eyes -->
  <circle cx="44" cy="40" r="11" fill="#0c2a4a"/>
  <circle cx="76" cy="40" r="11" fill="#0c2a4a"/>
  <circle cx="44" cy="40" r="7" fill="#38bdf8"/>
  <circle cx="76" cy="40" r="7" fill="#38bdf8"/>
  <circle cx="44" cy="40" r="4" fill="white"/>
  <circle cx="76" cy="40" r="4" fill="white"/>
  <circle cx="44" cy="40" r="2" fill="#0c2a4a"/>
  <circle cx="76" cy="40" r="2" fill="#0c2a4a"/>
  <!-- Eye shine -->
  <circle cx="40" cy="36" r="2" fill="white" opacity="0.9"/>
  <circle cx="72" cy="36" r="2" fill="white" opacity="0.9"/>

  <!-- Smile -->
  <path d="M47 57 Q60 66 73 57" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Neck -->
  <rect x="52" y="72" width="16" height="10" rx="4" fill="#0284c7"/>

  <!-- Body -->
  <rect x="22" y="82" width="76" height="50" rx="20" fill="#0ea5e9" filter="url(#shadow-o)"/>

  <!-- Chest panel -->
  <rect x="36" y="92" width="48" height="32" rx="8" fill="#0c2a4a"/>
  <!-- Network nodes on panel -->
  <circle cx="60" cy="100" r="5" fill="#38bdf8"/>
  <line x1="60" y1="105" x2="48" y2="114" stroke="#38bdf8" stroke-width="1.5"/>
  <line x1="60" y1="105" x2="72" y2="114" stroke="#38bdf8" stroke-width="1.5"/>
  <circle cx="48" cy="116" r="4" fill="#7dd3fc"/>
  <circle cx="72" cy="116" r="4" fill="#7dd3fc"/>

  <!-- Arms -->
  <rect x="6" y="86" width="16" height="32" rx="8" fill="#0ea5e9"/>
  <circle cx="14" cy="120" r="7" fill="#0284c7"/>
  <rect x="98" y="86" width="16" height="32" rx="8" fill="#0ea5e9"/>
  <circle cx="106" cy="120" r="7" fill="#0284c7"/>
</svg>
