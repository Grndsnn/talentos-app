<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 140" width="120" height="140">
  <defs>
    <filter id="shadow-r">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#ef4444" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Antenna - warning style -->
  <line x1="55" y1="10" x2="57" y2="22" stroke="#fca5a5" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="65" y1="10" x2="63" y2="22" stroke="#fca5a5" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Warning triangle left -->
  <polygon points="55,2 49,12 61,12" fill="#f59e0b"/>
  <text x="53.5" y="10" font-size="7" fill="#431407" font-weight="bold" font-family="Arial">!</text>
  <!-- Warning triangle right -->
  <polygon points="65,2 59,12 71,12" fill="#f59e0b"/>
  <text x="63.5" y="10" font-size="7" fill="#431407" font-weight="bold" font-family="Arial">!</text>

  <!-- Head -->
  <rect x="28" y="20" width="64" height="52" rx="18" fill="#dc2626" filter="url(#shadow-r)"/>
  <ellipse cx="47" cy="30" rx="10" ry="5" fill="white" opacity="0.15" transform="rotate(-15,47,30)"/>

  <!-- Eyes - visor/scanner -->
  <rect x="30" y="34" width="60" height="16" rx="6" fill="#450a0a"/>
  <rect x="31" y="35" width="58" height="14" rx="5" fill="#7f1d1d"/>
  <!-- Pupils -->
  <circle cx="44" cy="42" r="6" fill="#ef4444"/>
  <circle cx="76" cy="42" r="6" fill="#ef4444"/>
  <circle cx="44" cy="42" r="3" fill="white"/>
  <circle cx="76" cy="42" r="3" fill="white"/>
  <circle cx="44" cy="42" r="1.5" fill="#450a0a"/>
  <circle cx="76" cy="42" r="1.5" fill="#450a0a"/>
  <!-- Scan beam across visor -->
  <rect x="31" y="41" width="58" height="2" rx="1" fill="#fca5a5" opacity="0.3"/>
  <!-- Bridge -->
  <rect x="57" y="38" width="6" height="8" rx="2" fill="#450a0a"/>

  <!-- Mouth - stern line -->
  <rect x="46" y="58" width="28" height="5" rx="2.5" fill="#450a0a"/>
  <rect x="48" y="59" width="5" height="3" rx="1" fill="#ef4444"/>
  <rect x="55" y="59" width="10" height="3" rx="1" fill="#f87171"/>
  <rect x="67" y="59" width="5" height="3" rx="1" fill="#ef4444"/>

  <!-- Neck -->
  <rect x="52" y="72" width="16" height="10" rx="4" fill="#b91c1c"/>

  <!-- Body -->
  <rect x="22" y="82" width="76" height="50" rx="20" fill="#dc2626" filter="url(#shadow-r)"/>

  <!-- Chest panel: audit clipboard -->
  <rect x="36" y="92" width="48" height="32" rx="8" fill="#450a0a"/>
  <!-- Clipboard clip -->
  <rect x="50" y="89" width="20" height="7" rx="3" fill="#b91c1c"/>
  <!-- Check rows -->
  <path d="M42 100 L45 103 L50 97" stroke="#4ade80" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="54" y1="100" x2="79" y2="100" stroke="#fca5a5" stroke-width="1.5" opacity="0.6"/>
  <path d="M42 108 L45 111 L50 105" stroke="#4ade80" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="54" y1="108" x2="79" y2="108" stroke="#fca5a5" stroke-width="1.5" opacity="0.6"/>
  <!-- Warning row -->
  <line x1="42" y1="116" x2="79" y2="116" stroke="#f59e0b" stroke-width="1.5"/>

  <!-- Arms -->
  <rect x="6" y="86" width="16" height="32" rx="8" fill="#dc2626"/>
  <circle cx="14" cy="120" r="7" fill="#b91c1c"/>
  <rect x="98" y="86" width="16" height="32" rx="8" fill="#dc2626"/>
  <circle cx="106" cy="120" r="7" fill="#b91c1c"/>
</svg>
