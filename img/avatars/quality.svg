<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 140" width="120" height="140">
  <defs>
    <filter id="shadow-pk">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#ec4899" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Antenna with heart -->
  <line x1="60" y1="10" x2="60" y2="22" stroke="#f472b6" stroke-width="3" stroke-linecap="round"/>
  <path d="M60 5 C57 2 53 4 53 7.5 C53 10 56 13 60 16 C64 13 67 10 67 7.5 C67 4 63 2 60 5Z" fill="#ec4899"/>

  <!-- Head -->
  <rect x="28" y="20" width="64" height="52" rx="18" fill="#ec4899" filter="url(#shadow-pk)"/>
  <ellipse cx="47" cy="30" rx="10" ry="5" fill="white" opacity="0.15" transform="rotate(-15,47,30)"/>

  <!-- Eyes -->
  <circle cx="44" cy="40" r="11" fill="#4a0022"/>
  <circle cx="76" cy="40" r="11" fill="#4a0022"/>
  <circle cx="44" cy="40" r="7" fill="#f472b6"/>
  <circle cx="76" cy="40" r="7" fill="#f472b6"/>
  <circle cx="44" cy="40" r="4" fill="white"/>
  <circle cx="76" cy="40" r="4" fill="white"/>
  <circle cx="44" cy="40" r="2" fill="#4a0022"/>
  <circle cx="76" cy="40" r="2" fill="#4a0022"/>
  <circle cx="40" cy="36" r="2" fill="white" opacity="0.9"/>
  <circle cx="72" cy="36" r="2" fill="white" opacity="0.9"/>

  <!-- Happy smile -->
  <path d="M44 56 Q60 68 76 56" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Blush -->
  <ellipse cx="33" cy="52" rx="7" ry="5" fill="#f9a8d4" opacity="0.5"/>
  <ellipse cx="87" cy="52" rx="7" ry="5" fill="#f9a8d4" opacity="0.5"/>

  <!-- Neck -->
  <rect x="52" y="72" width="16" height="10" rx="4" fill="#db2777"/>

  <!-- Body -->
  <rect x="22" y="82" width="76" height="50" rx="20" fill="#ec4899" filter="url(#shadow-pk)"/>

  <!-- Chest panel -->
  <rect x="36" y="92" width="48" height="32" rx="8" fill="#4a0022"/>
  <!-- Checkmark on badge -->
  <circle cx="60" cy="108" r="10" fill="none" stroke="#f472b6" stroke-width="2"/>
  <path d="M54 108 L58 112 L66 102" stroke="#4ade80" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Arms -->
  <rect x="6" y="86" width="16" height="32" rx="8" fill="#ec4899"/>
  <circle cx="14" cy="120" r="7" fill="#db2777"/>
  <rect x="98" y="86" width="16" height="32" rx="8" fill="#ec4899"/>
  <circle cx="106" cy="120" r="7" fill="#db2777"/>
</svg>
