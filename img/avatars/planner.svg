<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 140" width="120" height="140">
  <defs>
    <filter id="shadow-c">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#06b6d4" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Antenna (double) -->
  <line x1="48" y1="8" x2="51" y2="22" stroke="#22d3ee" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="72" y1="8" x2="69" y2="22" stroke="#22d3ee" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="47" cy="6" r="4.5" fill="#22d3ee"/>
  <circle cx="73" cy="6" r="4.5" fill="#22d3ee"/>
  <circle cx="47" cy="6" r="2" fill="#cffafe"/>
  <circle cx="73" cy="6" r="2" fill="#cffafe"/>

  <!-- Head -->
  <rect x="28" y="20" width="64" height="52" rx="18" fill="#06b6d4" filter="url(#shadow-c)"/>
  <ellipse cx="47" cy="30" rx="10" ry="5" fill="white" opacity="0.15" transform="rotate(-15,47,30)"/>

  <!-- Eyes -->
  <circle cx="44" cy="40" r="11" fill="#083344"/>
  <circle cx="76" cy="40" r="11" fill="#083344"/>
  <circle cx="44" cy="40" r="7" fill="#22d3ee"/>
  <circle cx="76" cy="40" r="7" fill="#22d3ee"/>
  <circle cx="44" cy="40" r="4" fill="white"/>
  <circle cx="76" cy="40" r="4" fill="white"/>
  <circle cx="44" cy="40" r="2" fill="#083344"/>
  <circle cx="76" cy="40" r="2" fill="#083344"/>
  <circle cx="40" cy="36" r="2" fill="white" opacity="0.9"/>
  <circle cx="72" cy="36" r="2" fill="white" opacity="0.9"/>

  <!-- Smile -->
  <path d="M47 57 Q60 66 73 57" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Neck -->
  <rect x="52" y="72" width="16" height="10" rx="4" fill="#0e7490"/>

  <!-- Body -->
  <rect x="22" y="82" width="76" height="50" rx="20" fill="#06b6d4" filter="url(#shadow-c)"/>

  <!-- Chest panel: Kanban board -->
  <rect x="36" y="92" width="48" height="32" rx="8" fill="#083344"/>
  <!-- Columns -->
  <rect x="40" y="97" width="11" height="8" rx="2" fill="#22d3ee" opacity="0.8"/>
  <rect x="40" y="107" width="11" height="5" rx="2" fill="#22d3ee" opacity="0.5"/>
  <rect x="54" y="97" width="11" height="5" rx="2" fill="#0891b2"/>
  <rect x="54" y="104" width="11" height="8" rx="2" fill="#0891b2" opacity="0.6"/>
  <rect x="68" y="97" width="11" height="10" rx="2" fill="#4ade80" opacity="0.8"/>
  <!-- Dividers -->
  <line x1="52" y1="95" x2="52" y2="123" stroke="#0e7490" stroke-width="1" opacity="0.5"/>
  <line x1="66" y1="95" x2="66" y2="123" stroke="#0e7490" stroke-width="1" opacity="0.5"/>

  <!-- Arms -->
  <rect x="6" y="86" width="16" height="32" rx="8" fill="#06b6d4"/>
  <circle cx="14" cy="120" r="7" fill="#0e7490"/>
  <rect x="98" y="86" width="16" height="32" rx="8" fill="#06b6d4"/>
  <circle cx="106" cy="120" r="7" fill="#0e7490"/>
</svg>
