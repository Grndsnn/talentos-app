<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 140" width="120" height="140">
  <defs>
    <filter id="shadow-p">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#f97316" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Antenna -->
  <line x1="60" y1="8" x2="60" y2="22" stroke="#fb923c" stroke-width="3" stroke-linecap="round"/>
  <rect x="53" y="3" width="14" height="8" rx="3" fill="#f97316"/>
  <circle cx="60" cy="7" r="2.5" fill="#fed7aa"/>

  <!-- Head -->
  <rect x="28" y="20" width="64" height="52" rx="18" fill="#f97316" filter="url(#shadow-p)"/>
  <ellipse cx="47" cy="30" rx="10" ry="5" fill="white" opacity="0.15" transform="rotate(-15,47,30)"/>

  <!-- Eyes -->
  <circle cx="44" cy="40" r="11" fill="#431407"/>
  <circle cx="76" cy="40" r="11" fill="#431407"/>
  <circle cx="44" cy="40" r="7" fill="#fb923c"/>
  <circle cx="76" cy="40" r="7" fill="#fb923c"/>
  <circle cx="44" cy="40" r="4" fill="white"/>
  <circle cx="76" cy="40" r="4" fill="white"/>
  <circle cx="44" cy="40" r="2" fill="#431407"/>
  <circle cx="76" cy="40" r="2" fill="#431407"/>
  <circle cx="40" cy="36" r="2" fill="white" opacity="0.9"/>
  <circle cx="72" cy="36" r="2" fill="white" opacity="0.9"/>

  <!-- Smile -->
  <path d="M47 57 Q60 66 73 57" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Neck -->
  <rect x="52" y="72" width="16" height="10" rx="4" fill="#ea580c"/>

  <!-- Body -->
  <rect x="22" y="82" width="76" height="50" rx="20" fill="#f97316" filter="url(#shadow-p)"/>

  <!-- Chest panel -->
  <rect x="36" y="92" width="48" height="32" rx="8" fill="#431407"/>
  <!-- Magnifier icon -->
  <circle cx="57" cy="104" r="7" fill="none" stroke="#fb923c" stroke-width="2.5"/>
  <line x1="62" y1="109" x2="68" y2="115" stroke="#fb923c" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Lines to search -->
  <line x1="44" y1="118" x2="58" y2="118" stroke="#fed7aa" stroke-width="1.5" opacity="0.6"/>
  <line x1="44" y1="122" x2="54" y2="122" stroke="#fed7aa" stroke-width="1.5" opacity="0.4"/>

  <!-- Arms -->
  <rect x="6" y="86" width="16" height="32" rx="8" fill="#f97316"/>
  <circle cx="14" cy="120" r="7" fill="#ea580c"/>
  <rect x="98" y="86" width="16" height="32" rx="8" fill="#f97316"/>
  <circle cx="106" cy="120" r="7" fill="#ea580c"/>
</svg>
