<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 140" width="120" height="140">
  <defs>
    <filter id="shadow-g">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#22c55e" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Antenna with signal waves -->
  <line x1="60" y1="8" x2="60" y2="22" stroke="#4ade80" stroke-width="3" stroke-linecap="round"/>
  <circle cx="60" cy="6" r="5" fill="#22c55e"/>
  <path d="M52 4 Q60 0 68 4" stroke="#4ade80" stroke-width="1.8" fill="none" opacity="0.7"/>
  <path d="M48 1 Q60 -4 72 1" stroke="#4ade80" stroke-width="1.2" fill="none" opacity="0.4"/>

  <!-- Head -->
  <rect x="28" y="20" width="64" height="52" rx="18" fill="#16a34a" filter="url(#shadow-g)"/>
  <ellipse cx="47" cy="30" rx="10" ry="5" fill="white" opacity="0.15" transform="rotate(-15,47,30)"/>

  <!-- Eyes - scanner bars -->
  <circle cx="44" cy="40" r="11" fill="#052e16"/>
  <circle cx="76" cy="40" r="11" fill="#052e16"/>
  <rect x="35" y="36" width="18" height="8" rx="3" fill="#4ade80"/>
  <rect x="67" y="36" width="18" height="8" rx="3" fill="#4ade80"/>
  <!-- Scan line -->
  <rect x="36" y="39.5" width="16" height="2" rx="1" fill="white" opacity="0.9"/>
  <rect x="68" y="39.5" width="16" height="2" rx="1" fill="white" opacity="0.9"/>

  <!-- Smile -->
  <path d="M47 57 Q60 66 73 57" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Neck -->
  <rect x="52" y="72" width="16" height="10" rx="4" fill="#15803d"/>

  <!-- Body -->
  <rect x="22" y="82" width="76" height="50" rx="20" fill="#16a34a" filter="url(#shadow-g)"/>

  <!-- Chest panel: data/PDF icon -->
  <rect x="36" y="92" width="48" height="32" rx="8" fill="#052e16"/>
  <!-- Data rows -->
  <rect x="42" y="98" width="28" height="3" rx="1.5" fill="#4ade80"/>
  <rect x="42" y="103" width="22" height="3" rx="1.5" fill="#4ade80" opacity="0.7"/>
  <rect x="42" y="108" width="26" height="3" rx="1.5" fill="#4ade80" opacity="0.5"/>
  <rect x="42" y="113" width="18" height="3" rx="1.5" fill="#4ade80" opacity="0.4"/>
  <!-- Arrow out -->
  <line x1="72" y1="108" x2="79" y2="108" stroke="#86efac" stroke-width="2" stroke-linecap="round"/>
  <polygon points="79,105 83,108 79,111" fill="#86efac"/>

  <!-- Arms -->
  <rect x="6" y="86" width="16" height="32" rx="8" fill="#16a34a"/>
  <circle cx="14" cy="120" r="7" fill="#15803d"/>
  <rect x="98" y="86" width="16" height="32" rx="8" fill="#16a34a"/>
  <circle cx="106" cy="120" r="7" fill="#15803d"/>
</svg>
